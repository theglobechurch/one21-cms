default: &default
  adapter: postgresql
  encoding: unicode
  host: db
  username: postgres
  ? password
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: localhost
  database: one21-cms_development
  username: localuser
  password: password

test:
  <<: *default
  host: localhost
  database: one21-cms_test
  username: localuser
  password: password

